<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal Video Tester</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./libs/WSPlayer/player.css" />
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>Universal Video Tester</h1>
      <p>通用视频测试平台：标准播放器能力放在通用模块，厂商私有 SDK 独立成插件模块。</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnCheckAssets">检查资源</button>
      <button class="btn" id="btnCopyReport">复制诊断</button>
      <button class="btn" id="btnClearLog">清空日志</button>
    </div>
  </header>

  <section class="status-grid">
    <div class="status-card">
      <strong>当前模块</strong>
      <span class="badge info" id="statusModule">未选择</span>
    </div>
    <div class="status-card">
      <strong>通用播放</strong>
      <span class="badge" id="statusGeneric">未运行</span>
    </div>
    <div class="status-card">
      <strong>直连 WSS</strong>
      <span class="badge" id="statusDirect">未测试</span>
    </div>
    <div class="status-card">
      <strong>大华 WSPlayer</strong>
      <span class="badge" id="statusDahua">未运行</span>
    </div>
  </section>

  <div class="layout">
    <aside class="panel module-list">
      <div class="panel-header">
        <h2>测试模块</h2>
      </div>
      <div class="module-tabs" id="moduleTabs"></div>
    </aside>

    <section class="workspace">
      <section class="panel">
        <div class="panel-header">
          <h2 id="moduleTitle">模块</h2>
          <span class="badge" id="moduleTag">plugin</span>
        </div>
        <div class="panel-body" id="modulePanel"></div>
      </section>

      <section class="panel stage-panel">
        <div class="panel-header">
          <h2>播放 / 数据窗口</h2>
          <span class="stage-meta" id="stageMeta">等待测试</span>
        </div>
        <div class="stage" id="stage"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>测试日志</h2>
          <span class="badge" id="logCount">0 条</span>
        </div>
        <pre class="log" id="log"></pre>
      </section>
    </section>
  </div>
</main>

<script src="./libs/WSPlayer/PlaySDKInterface.js"></script>
<script src="./libs/WSPlayer/WSPlayer.js"></script>
<script src="./js/app.js"></script>
<script src="./js/modules/generic-player.js"></script>
<script src="./js/modules/direct-wss.js"></script>
<script src="./js/modules/dahua-wsplayer.js"></script>
</body>
</html>
